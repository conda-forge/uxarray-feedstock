schema_version: 1

context:
  name: uxarray
  version: "2026.10.1"

recipe:
  name: ${{ name }}-split
  version: ${{ version }}

source:
  url: https://github.com/UXARRAY/uxarray/archive/v${{ version }}.tar.gz
  sha256: b141b28addc8515277dc0a0b6018d44248c65136cb3f307ff4e0110409406076

build:
  number: 0

outputs:
  # The dependencies below mirror v${{ version }}'s pyproject.toml: `uxarray-base` carries
  # [project.dependencies], `uxarray-with-geo` and `uxarray-with-viz` add the `geo` and
  # `viz` extras from [project.optional-dependencies] on top of it, and `uxarray` pulls in
  # both, like upstream's `all` extra minus the `dev` tools.
  - package:
      name: ${{ name }}-base
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
        - setuptools-scm
      run:
        - antimeridian
        # dask-core + pandas + pyarrow is the conda-forge equivalent of upstream's
        # dask[dataframe].  The `dask` metapackage would additionally pull in
        # distributed, bokeh, lz4, cytoolz and jinja2, none of which uxarray uses --
        # it only ever imports dask.array.
        - dask-core
        - netcdf4
        # 0.63 is the first release supporting Python 3.14
        - numba >=0.63
        - numpy
        - pandas
        - polars
        # supplies what dask[dataframe] brings in on the pip side; uxarray never
        # imports pyarrow directly
        - pyarrow
        - python >=${{ python_min }}
        - scikit-learn
        - scipy
        - shapely
        - xarray
    tests:
      - python:
          imports:
            - uxarray
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: ${{ name }}-with-geo
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage(name ~ "-base", exact=True) }}
        - python >=${{ python_min }}
        # upstream `geo` extra
        # cartopy is in both `geo` and `viz` because to_geodataframe() needs it too
        - cartopy
        # 1.0 is the first release requiring pyogrio, the file-IO backend read_file needs
        - geopandas >=1.0
        - healpix
        - pyproj
        - spatialpandas
    tests:
      - python:
          imports:
            - uxarray
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: ${{ name }}-with-viz
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage(name ~ "-base", exact=True) }}
        - python >=${{ python_min }}
        # upstream `viz` extra
        # cartopy 0.26 fixes plotting with matplotlib 3.11 (UXARRAY/uxarray#1542)
        - cartopy >=0.26.0
        - datashader
        # geoviews 1.16 fixes cartopy 0.26 compatibility (UXARRAY/uxarray#1780)
        - geoviews >=1.16.0
        - holoviews
        - hvplot
        - matplotlib-base >=3.8.4
    tests:
      - python:
          imports:
            - uxarray
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

  - package:
      name: ${{ name }}
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - ${{ pin_subpackage(name ~ "-with-geo", exact=True) }}
        - ${{ pin_subpackage(name ~ "-with-viz", exact=True) }}
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - uxarray
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

about:
  description: |
    Uxarray aims to address the geoscience community need for tools that enable standard data analysis techniques to operate directly on unstructured grid data.
    Uxarray will provide Xarray styled functions to better read in and use unstructured grid datasets that follow standard conventions, including UGRID, SCRIP,
    Exodus and shapefile formats. This effort is a result of the collaboration between Project Raijin
    (NCAR and Pennsylvania State University) and the SEATS Project (Argonne National Laboratory, UC Davis, and Lawrence Livermore National Laboratory).
    The Uxarray team welcomes other community members to become part of this collaboration at any level of contribution.

  license: Apache-2.0
  license_file: LICENSE
  summary: Xarray extension for unstructured climate and global weather data analysis and visualization
  homepage: https://github.com/UXARRAY/uxarray

extra:
  feedstock-name: uxarray
  recipe-maintainers:
    - xylar
    - paullric
    - erogluorhan
    - rajeeja
    - chengzhuzhang
    - philipc2
